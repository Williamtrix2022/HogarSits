{% load static %}<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · HogarSits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="entrada">
    <div class="tarjeta">
      <div class="logo"><strong>HogarSits</strong><span>Gestión y Análisis Inmobiliario</span></div>
      <h1>Iniciar sesión</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% if form.errors %}<p class="aviso-error" role="alert">{% firstof form.non_field_errors.0 "Revise los datos e intente de nuevo." %}</p>{% endif %}
        <div class="campo">
          <label for="{{ form.username.id_for_label }}">Usuario</label>
          <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required value="{{ form.username.value|default_if_none:'' }}">
        </div>
        <div class="campo">
          <label for="{{ form.password.id_for_label }}">Contraseña</label>
          <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="boton" type="submit">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>

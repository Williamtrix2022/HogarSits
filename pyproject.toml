[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "migrations", ".agents"]  # .agents: skills de terceros, no se lintean ni se corrigen

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "apps"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # mensajes y nombres de prueba descriptivos

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/management/__init__.py"]

[tool.coverage.report]
show_missing = false
skip_empty = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:"]

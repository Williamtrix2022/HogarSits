services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hogarsits
      POSTGRES_USER: hogarsits
      POSTGRES_PASSWORD: hogarsits
    ports:
      - "5433:5432"  # 5433 en el host: evita choque con un PostgreSQL local en 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogarsits"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://hogarsits:hogarsits@db:5432/hogarsits
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
